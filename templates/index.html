<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>San Jose Weather</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #eef3f8;
            color: #1f2a37;
        }
        .card {
            text-align: center;
            padding: 2rem 3rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        .temp { font-size: 4rem; font-weight: 600; margin: 0.5rem 0; }
        .desc { font-size: 1.25rem; color: #4b5563; }
        .error { color: #b91c1c; }
        .link { display: inline-block; margin-top: 1rem; color: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>San Jose, California</h1>
        {% if weather %}
            <p class="temp">{{ weather.temperature }}&deg;F</p>
            <p class="desc">{{ weather.description }}</p>
        {% else %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <a class="link" href="{{ url_for('zip_weather') }}">Check weather by zip code</a>
    </div>
</body>
</html>
